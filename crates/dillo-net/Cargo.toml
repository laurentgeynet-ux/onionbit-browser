[package]
name = "dillo-net"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
brotli = "8"
crc32fast = "1.5.2"
dillo-common.workspace = true
encoding_rs = "0.8.35"
flate2 = { version = ">=1.1.5,<1.1.10", default-features = false, features = ["rust_backend"] }
rustls = { version = "0.23", features = ["logging", "std", "tls12"] }
rustls-native-certs = "0.8.5"
socket2 = "0.6.5"
thiserror.workspace = true
tokio = { version = "1.53.3", features = ["rt", "sync", "net", "time", "io-util", "macros"] }
tracing.workspace = true
