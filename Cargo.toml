[workspace]
resolver = "2"
members = [
    "crates/dillo-common",
    "crates/dillo-net",
    "crates/dillo-css",
    "crates/dillo-html",
    "crates/dillo-dw",
    "crates/dillo-dw-proto",
    "crates/dillo-images",
    "crates/dillo-platform",
    "crates/dillo-browser",
    "crates/dillo-dpi",
    "crates/dillo",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "local://dillorust"

[workspace.dependencies]
# Crates internes
dillo-common = { path = "crates/dillo-common" }
dillo-net = { path = "crates/dillo-net" }
dillo-css = { path = "crates/dillo-css" }
dillo-html = { path = "crates/dillo-html" }
dillo-dw = { path = "crates/dillo-dw" }
dillo-images = { path = "crates/dillo-images" }
dillo-platform = { path = "crates/dillo-platform" }
dillo-browser = { path = "crates/dillo-browser" }
dillo-dpi = { path = "crates/dillo-dpi" }

# Crates externes — pur Rust uniquement (AGENTS.md §4.2),
# pin minor, ≥ 7 jours depuis publication.
thiserror = "2.0"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
