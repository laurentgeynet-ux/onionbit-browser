[workspace]
resolver = "2"
members = [
    "crates/dillo-common",
    "crates/dillo-net",
    "crates/dillo-css",
    "crates/dillo-html",
    "crates/dillo-dw",
    "crates/dillo-dw-proto",
    "crates/dillo-images",
    "crates/dillo-platform",
    "crates/dillo-browser",
    "crates/dillo-dpi",
    "crates/dillo",
]

[workspace.package]
edition = "2021"
# 1.86 : trait upcasting (`Rc<dyn SubResource>` → `Rc<dyn Resource>`,
# ≙ héritage C++ `Resource*` amont — form.cc/dillo-html).
rust-version = "1.86"
license = "GPL-3.0-or-later"
repository = "local://dillorust"

[workspace.dependencies]
# Crates internes
dillo-common = { path = "crates/dillo-common" }
dillo-net = { path = "crates/dillo-net" }
dillo-css = { path = "crates/dillo-css" }
dillo-html = { path = "crates/dillo-html" }
dillo-dw = { path = "crates/dillo-dw" }
dillo-images = { path = "crates/dillo-images" }
dillo-platform = { path = "crates/dillo-platform" }
dillo-browser = { path = "crates/dillo-browser" }
dillo-dpi = { path = "crates/dillo-dpi" }

# Crates externes — pur Rust uniquement (AGENTS.md §4.2),
# pin minor, ≥ 7 jours depuis publication.
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
# Runtime I/O (ADR-0003) — worker threads alimentent les moteurs
# Io/Dns/Http/Tls ; l'UI draine via `poll_*` à chaque tick.
tokio = { version = "1.53", features = ["rt-multi-thread"] }
# ADR-0002 : stack de rendu validée — fenêtre/surface/raster/fontes.
tiny-skia = "0.11"
winit = "0.30"
softbuffer = "0.4"
cosmic-text = "0.12"
# Sérialisation PNG des golden renders (pur Rust, dev/test).
png = "0.17"
# Décodeurs image (pur Rust) — ≙ libjpeg/libwebp/libpng amont.
jpeg-decoder = { version = "0.3", default-features = false }
image-webp = "0.2"
# Encodeur JPEG pour les tests du décodeur (pur Rust, dev-only).
jpeg-encoder = "0.6"
# Rasteriseur SVG ≙ nanosvg amont (pas de raster embarqué amont
# non plus → default-features off).
resvg = { version = "0.45", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
